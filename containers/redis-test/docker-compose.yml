services:
  redis-test:
    image: redis/redis-stack:latest
    container_name: redis-test
    ports: # local:container
      - "6380:6379"
      - "8002:8001"
    # command: ["redis-server"] --> for run container with custom params
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - redis_data:/data
    networks:
      - compose-net
    restart: unless-stopped

volumes:
  redis_data:

networks:
  compose-net:
    driver: bridge